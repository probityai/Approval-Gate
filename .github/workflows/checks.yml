name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python test_mock.py
      - run: python scripts/check_coverage.py --src-dir wrapper --test-path . --summary
      - run: ruff check wrapper/wrapper.py wrapper/source_checks.py wrapper/probity_bridge.py wrapper/replay.py wrapper/audit.py wrapper/serve.py tests
