name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.23'
          enable-cache: true
      - run: uv sync --locked
      - name: Check compatibility exports
        run: |
          uv export --locked --no-hashes --no-header --no-annotate --no-dev --output-file /tmp/probity-requirements.txt > /dev/null
          diff -u requirements.txt /tmp/probity-requirements.txt
          uv export --locked --no-hashes --no-header --no-annotate --all-groups --output-file /tmp/probity-requirements-dev.txt > /dev/null
          diff -u requirements-dev.txt /tmp/probity-requirements-dev.txt
      - run: uv run --locked python -m pytest -q
      - run: uv run --locked python test_mock.py
      - run: uv run --locked python scripts/check_coverage.py --src-dir wrapper --test-path . --summary
      - run: uv run --locked ruff check wrapper/wrapper.py wrapper/source_checks.py wrapper/probity_bridge.py wrapper/replay.py wrapper/audit.py wrapper/serve.py tests
